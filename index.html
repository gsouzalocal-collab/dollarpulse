<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DOLLARPULSE — Trending Products</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      padding: 28px 20px;
      border-bottom: 1px solid #22222a;
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .logo span {
      color: #39e58c;
    }

    .tagline {
      margin-top: 8px;
      color: #9b9ba5;
      font-size: 14px;
    }

    .hero {
      padding: 45px 20px 30px;
      text-align: center;
    }

    .hero h1 {
      font-size: 36px;
      line-height: 1.1;
      margin-bottom: 15px;
    }

    .hero p {
      color: #a5a5af;
      max-width: 600px;
      margin: auto;
      line-height: 1.6;
    }

    .section {
      padding: 25px 20px 50px;
      max-width: 1100px;
      margin: auto;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: #15151b;
      border: 1px solid #26262f;
      border-radius: 16px;
      padding: 20px;
    }

    .badge {
      display: inline-block;
      background: #193b2b;
      color: #39e58c;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .product-icon {
      height: 130px;
      border-radius: 12px;
      background: #202028;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      margin-bottom: 18px;
    }

    .card h3 {
      font-size: 18px;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      background: #39e58c;
      color: #07100b;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
    }

    .button:hover {
      opacity: 0.9;
    }

    .info {
      text-align: center;
      padding: 35px 20px;
      border-top: 1px solid #22222a;
      color: #777783;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">DOLLAR<span>PULSE</span></div>
    <div class="tagline">Discover what shoppers are buying.</div>
  </header>

  <section class="hero">
    <h1>Trending Products<br>
